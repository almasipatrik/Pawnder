services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-petpals}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petpals}
      POSTGRES_DB: ${POSTGRES_DB:-petpals}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-petpals}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025" # Web UI for inspecting local OTP emails
      - "1025:1025" # SMTP server

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-petpals}:${POSTGRES_PASSWORD:-petpals}@postgres:5432/${POSTGRES_DB:-petpals}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      JWT_SECRET: ${JWT_SECRET:-pawnder-secret-change-in-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-"Pawnder <noreply@pawnder.hu>"}
      SCRAPER_CRON_ENABLED: ${SCRAPER_CRON_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  scraper-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.scraper
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${RDS_DATABASE_URL:-postgresql://pawnder:pawnder@postgres:5432/pawnder}
      DATABASE_SSL: ${RDS_DATABASE_SSL:-false}
      SCRAPER_MAX_PAGES: ${SCRAPER_MAX_PAGES:-10}
      SCRAPER_VERIFY_REMOVED_BATCH: ${SCRAPER_VERIFY_REMOVED_BATCH:-150}
      SCRAPER_INTERVAL_MINUTES: ${SCRAPER_INTERVAL_MINUTES:-240}
      SCRAPER_RUN_ONCE: "false"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-G-XXXXXXXXXX}
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  pgdata:

